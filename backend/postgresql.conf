# PostgreSQL Configuration — Optimized for 4GB RAM VPS (shared with ML backend)
# This config is tuned for a low-memory server running PostgreSQL
# alongside a FastAPI backend (with ML models) and Next.js frontend.

# ---------------------------------------------------------------------------
# Memory Settings
# ---------------------------------------------------------------------------

listen_addresses = '*'


# Shared memory buffer — minimal since ML models need most of the RAM
# 64MB is sufficient for a simple CRUD app with ~20 tables
shared_buffers = 64MB

# Per-operation sort/hash memory — keep conservative
work_mem = 2MB

# Memory for maintenance operations (VACUUM, CREATE INDEX)
maintenance_work_mem = 32MB

# OS cache estimate — helps query planner make better decisions
effective_cache_size = 256MB

# ---------------------------------------------------------------------------
# Connection Limits
# ---------------------------------------------------------------------------

# Limit connections to reduce per-connection memory overhead (~10MB each)
max_connections = 10

# ---------------------------------------------------------------------------
# WAL & Checkpoint Settings
# ---------------------------------------------------------------------------

# Smaller WAL buffers to save memory
wal_buffers = 4MB

# Spread checkpoints over longer period (reduces I/O spikes)
checkpoint_completion_target = 0.9

# ---------------------------------------------------------------------------
# Logging (minimal for production)
# ---------------------------------------------------------------------------
log_min_duration_statement = 1000
log_statement = 'none'

# ---------------------------------------------------------------------------
# Temp File Limits
# ---------------------------------------------------------------------------

# Limit temp file usage per query to prevent runaway queries
temp_file_limit = 256MB
