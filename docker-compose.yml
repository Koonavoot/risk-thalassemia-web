services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: thalassemia_db
    restart: unless-stopped
    # Use -c parameters instead of mounting pg_hba.conf/postgresql.conf
    # to avoid conflicts with Docker entrypoint that can lock the postgres role
    command: >
      postgres
      -c shared_buffers=64MB
      -c work_mem=2MB
      -c maintenance_work_mem=32MB
      -c effective_cache_size=256MB
      -c max_connections=20
      -c wal_buffers=4MB
      -c checkpoint_completion_target=0.9
      -c log_min_duration_statement=1000
      -c log_statement=none
      -c temp_file_limit=256MB
      -c listen_addresses='*'
      -c password_encryption=md5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: thala_SECURE_db_2026!X
      POSTGRES_DB: thalassemia_db
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=trust"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres && psql -U postgres -d thalassemia_db -c 'SELECT 1'" ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thalassemia_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:thala_SECURE_db_2026!X@db:5432/thalassemia_db
      MODEL_PATH: model/Meta_Tabular_final.pt
      MODEL_ARTIFACTS_PATH: model
      SECRET_KEY: "change-this-to-a-random-secret-key-on-production"
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      LOGTAIL_SOURCE_TOKEN: ${LOGTAIL_SOURCE_TOKEN}
      # Limit PyTorch threads to reduce memory usage
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/model:/app/model
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2560M
        reservations:
          memory: 512M

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://backend:8000
    container_name: thalassemia_frontend
    restart: unless-stopped
    ports: 
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

volumes:
  postgres_data:
